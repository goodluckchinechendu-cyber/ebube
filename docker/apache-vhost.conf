<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName ebubeconnect.com
    ServerAlias www.ebubeconnect.com
    # Behind Railway/Cloudflare proxy — do not advertise Listen port 8080 in redirects.
    UseCanonicalName On
    UseCanonicalPhysicalPort Off
    DocumentRoot /var/www/html

    DirectoryIndex index.html index.php

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    <Directory /var/www/html/agent>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    <Directory /var/www/html/private>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    # Prefer gzip for JS payloads behind Cloudflare.
    <IfModule mod_deflate.c>
      AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json
    </IfModule>
</VirtualHost>
